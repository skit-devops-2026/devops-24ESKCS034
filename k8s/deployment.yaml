apiVersion: apps/v1
kind: Deployment
metadata:
  name: insiderjobs-portal
  labels:
    app: insiderjobs-portal
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insiderjobs-portal
  template:
    metadata:
      labels:
        app: insiderjobs-portal
        tier: web
    spec:
      containers:
        - name: insiderjobs-portal
          image: ghcr.io/skit-devops-2026/devops-24eskcs034:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
