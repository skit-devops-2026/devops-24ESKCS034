name: CI/CD & DevOps Verification Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  validate:
    name: Lint, Static Analysis & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax, Lint & Unit Test Suite
        run: |
          echo "Running full validation pipeline..."
          npm run validate

  container-and-kubernetes:
    name: Docker Build, Registry Push & Kind K8s Verification
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Image Tag
        run: |
          # Docker requires lowercase repository names
          LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${LOWERCASE_REPO}:latest"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Configured Image Tag: ${IMAGE_TAG}"

      - name: Build Docker Image
        run: |
          echo "Building production Docker image..."
          docker build \
            -t "${{ env.IMAGE_TAG }}" \
            -t insiderjobs-portal:latest .

      - name: Test Docker Container Execution & Healthcheck
        run: |
          echo "Verifying docker run and endpoints..."
          docker run -d --name test-app -p 3000:3000 insiderjobs-portal:latest
          sleep 6
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/metrics
          docker stop test-app && docker rm test-app

      - name: Test Docker Compose Configuration
        run: |
          echo "Verifying docker-compose..."
          docker compose config
          docker compose up -d app
          sleep 6
          curl -f http://localhost:3000/health
          docker compose down

      - name: Set up Kind Kubernetes Cluster
        run: |
          echo "Installing Kind CLI..."
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          echo "Creating Kind cluster..."
          kind create cluster --name devops-cluster
          kubectl cluster-info

      - name: Load Image into Kind Cluster
        run: |
          echo "Loading Docker image into Kind..."
          kind load docker-image "${{ env.IMAGE_TAG }}" --name devops-cluster

      - name: Deploy Kubernetes Manifests
        run: |
          echo "Applying Kubernetes Deployment and Service..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify Kubernetes Pods & Rollout Status
        run: |
          echo "Waiting for pods to reach Ready state..."
          kubectl rollout status deployment/insiderjobs-portal --timeout=120s
          echo "=== KUBERNETES DEPLOYMENTS ==="
          kubectl get deployments -o wide
          echo "=== KUBERNETES PODS ==="
          kubectl get pods -o wide
          echo "=== KUBERNETES SERVICES ==="
          kubectl get services -o wide

      - name: Authenticate & Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Logging into GitHub Container Registry..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "Pushing image to ${{ env.IMAGE_TAG }}..."
          docker push "${{ env.IMAGE_TAG }}"

  deploy-pages:
    name: Deploy Live Demo to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
